version: '3.9'

services:
  # ======== FRONTEND ========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognicare-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - backend
    networks:
      - cognicare-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/_next/static"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======== BACKEND ========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognicare-backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_DEBUG=${BACKEND_DEBUG:-false}
      - BACKEND_PORT=8000
      - AZURE_COSMOS_ENDPOINT=${AZURE_COSMOS_ENDPOINT}
      - AZURE_COSMOS_KEY=${AZURE_COSMOS_KEY}
      - AZURE_COSMOS_DATABASE_ID=${AZURE_COSMOS_DATABASE_ID:-cognicare}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID:-}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET:-}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID:-}
      - AZURE_AI_KEY=${AZURE_AI_KEY:-}
      - AZURE_AI_ENDPOINT=${AZURE_AI_ENDPOINT:-}
      - AZURE_AI_AGENT_KEY=${AZURE_AI_AGENT_KEY:-}
      - AZURE_AI_AGENT_ENDPOINT=${AZURE_AI_AGENT_ENDPOINT:-}
      - AZURE_AI_DEPLOYMENT_NAME=${AZURE_AI_DEPLOYMENT_NAME:-}
    networks:
      - cognicare-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cognicare-network:
    driver: bridge
